      .small { font: 21px Arial, sans-serif; fill: #4b5872; }
      .arrow { fill: none; stroke: #27324a; stroke-width: 5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #52617d; stroke-width: 4; marker-end: url(#arrow); }
      .box { stroke-width: 4; rx: 20; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
